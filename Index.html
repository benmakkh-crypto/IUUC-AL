<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير حلقات القرآن الكريم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Hind+Siliguri:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17251f; --muted:#5d6b64; --paper:#f1f4ef; --card:#ffffff; --line:#d5ddd6;
  --green:#123c34; --green2:#1d5a4d; --gold:#b8893a; --goldbg:#f6ecd6; --ok:#1f7a4d; --err:#a63d2f; --errbg:#f9e6e2;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.7 'Tajawal',system-ui,sans-serif}
html[lang=bn] body,html[lang=bn] input,html[lang=bn] select,html[lang=bn] textarea,html[lang=bn] button{font-family:'Hind Siliguri','Tajawal',system-ui,sans-serif}
html[lang=en] body{line-height:1.55}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
.brand{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;background:var(--green);color:#fff;margin:0 -16px;padding:54px 20px 40px;border-bottom:4px solid var(--gold)}
.brand .lg{background:#fff;border-radius:16px;padding:8px 14px;line-height:0}
.brand .lg img{width:170px;height:auto}
.brand h1{font:700 28px/1.35 'Amiri',serif;margin:6px 0 0}
html:not([lang=ar]) .brand h1{font-family:'Hind Siliguri','Tajawal',sans-serif;font-size:24px}
.brand p{margin:0;color:#c9d9d2;font-size:14px;white-space:pre-line}
.brand p.sh{color:#ecd49a;font-size:15px;font-weight:500}
.langs{position:absolute;top:10px;inset-inline-end:14px;display:flex;gap:4px}
.langs button{font:500 13px 'Tajawal','Hind Siliguri',sans-serif;color:#dbe7e1;background:transparent;border:1px solid #5d8579;border-radius:20px;padding:2px 12px;cursor:pointer}
.langs button.on{background:#fff;color:var(--green);border-color:#fff}
main{margin-top:-18px;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
label.f{display:block;font-weight:500;font-size:14px;margin:14px 0 4px}
input[type=text],input[type=tel],input[type=email],input[type=date],textarea,select{
  width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=tel],input[type=email]{direction:ltr;text-align:left}
html[dir=rtl] input[type=tel],html[dir=rtl] input[type=email]{text-align:right}
input[type=tel]{font-size:19px;letter-spacing:.5px}
input:focus,textarea:focus,select:focus,button:focus-visible,.slot:focus-within{outline:3px solid #8fc1b2;outline-offset:1px}
.btn{display:block;width:100%;font:700 17px 'Tajawal',sans-serif;border:0;border-radius:8px;padding:13px;background:var(--green);color:#fff;cursor:pointer;margin-top:18px}
html[lang=bn] .btn{font-family:'Hind Siliguri',sans-serif}
.btn:hover{background:var(--green2)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.pick{display:block;width:100%;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:10px;font:inherit;cursor:pointer}
.pick:hover{border-color:var(--green)}
.pick b{display:block}.pick span{color:var(--muted);font-size:14px}

.me{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.me h2{font:700 22px/1.4 'Amiri','Hind Siliguri',serif}
.me small{color:var(--muted);display:block}
.linkbtn{background:none;border:0;color:var(--green);font:500 14px 'Tajawal','Hind Siliguri';text-decoration:underline;cursor:pointer;padding:4px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:0 0 14px}
.tabs button{flex:1;font:500 15px 'Tajawal','Hind Siliguri',sans-serif;padding:10px;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}

.note{border-radius:8px;padding:12px 14px;font-size:15px;margin-bottom:14px}
.note.info{background:var(--goldbg);border:1px solid #e3cf9d}
.note.good{background:#e3f3ea;border:1px solid #a9d6bd}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sec{font-weight:700;margin:22px 0 4px}
.sec small{font-weight:400;color:var(--muted);font-size:13px;margin-inline-start:6px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;aspect-ratio:1;border:2px dashed #aebdb4;border-radius:10px;background:#f8faf7 center/cover no-repeat;cursor:pointer;overflow:hidden;padding:6px;font-size:13px}
.slot .plus{font-size:28px;line-height:1;color:var(--green2)}
.slot small{color:var(--muted);font-size:12px}
.slot.has{border:2px solid var(--ok)}
.slot.has .plus,.slot.has b,.slot.has small{display:none}
.slot .tick{display:none;position:absolute;bottom:6px;inset-inline-end:6px;background:var(--ok);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;font-size:13px}
.slot.has .tick{display:block}
.vrow{display:flex;align-items:center;gap:10px;border:2px dashed #aebdb4;border-radius:10px;padding:12px;margin-top:10px;background:#f8faf7;cursor:pointer;position:relative}
.vrow.has{border:2px solid var(--ok);background:#eef7f1}
.vrow .ic{font-size:26px}
.vrow .t{flex:1;min-width:0}
.vrow .t b{display:block;font-size:15px}
.vrow .t span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext;text-align:start}
.x{position:absolute;inset-inline-start:8px;top:8px;background:#fff;border:1px solid var(--line);border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;display:none;z-index:2}
.has .x{display:block}
.vrow.has .x{top:50%;margin-top:-13px}

.overlay{position:fixed;inset:0;background:rgba(18,60,52,.88);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.overlay .box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:380px;text-align:center}
.bar{height:12px;background:#e3e9e5;border-radius:6px;overflow:hidden;margin:16px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
#toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:15px;z-index:60;max-width:90%;text-align:center}
#toast.err{background:var(--err)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center}
.stat b{display:block;font:700 30px/1.2 'Amiri','Hind Siliguri',serif}
.stat span{font-size:13px;color:var(--muted)}
.stat.ok b{color:var(--ok)}.stat.no b{color:var(--err)}
.meter{height:10px;background:#e3e9e5;border-radius:5px;overflow:hidden;margin:0 0 14px}
.meter i{display:block;height:100%;background:var(--ok)}
.row2{display:flex;gap:10px}.row2>*{flex:1 1 140px;min-width:0}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.item>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.item>summary::-webkit-details-marker{display:none}
.item>summary b{display:block}
.item>summary small{color:var(--muted);display:block;font-size:13px}
.badge{font-size:12px;border-radius:20px;padding:2px 10px;white-space:nowrap}
.badge.ok{background:#e3f3ea;color:var(--ok)}.badge.no{background:var(--errbg);color:var(--err)}
.item .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.thumbs img,.vt{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#e3e9e5;cursor:pointer;display:block}
.vt{display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--green);color:#fff;border:0}
.vwrap{margin-top:10px}.vwrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
.contact{display:flex;gap:8px;margin-top:10px}
.contact a{flex:1;text-align:center;padding:8px;border-radius:8px;border:1.5px solid var(--green);color:var(--green);text-decoration:none;font-size:14px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center;padding:12px}
.lb img{max-width:100%;max-height:92vh;border-radius:6px}
.lb a{position:absolute;top:14px;inset-inline-start:14px;color:#fff;font-size:15px;text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.hd{color:var(--muted);font-size:13px;margin:4px 0 0}
.contact button{flex:1;font:inherit;font-size:14px;padding:8px;border-radius:8px;border:1.5px solid var(--green);color:var(--green);background:#fff;cursor:pointer}
.contact button:disabled{opacity:.6;cursor:wait}
.stu{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.stu b{display:block}.stu small{color:var(--muted);font-size:13px;display:block}
.stu .act{display:flex;gap:6px;flex:0 0 auto}
.stu .act button{font:inherit;font-size:13px;padding:5px 10px;border-radius:6px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.stu .act .dl{color:var(--err);border-color:#e5b9b1}
.slist{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.slist div{padding:4px 0;border-bottom:1px solid #eef2ee}
.tabs.t3 button{font-size:14px;padding:10px 4px}
</style>
</head>

  </header>

  <main>
    <!-- Login -->
    <section id="v-login" class="card">
      <h2 data-i18n="loginTitle"></h2>
      <p class="sub" data-i18n="loginSub"></p>
      <label class="f" for="phone" data-i18n="phoneLbl"></label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX">
      <button id="btnLogin" class="btn" data-i18n="loginBtn"></button>
    </section>

    <!-- Choose teacher (shared number) -->
    <section id="v-pick" class="card hidden">
      <h2 data-i18n="pickTitle"></h2>
      <p class="sub" data-i18n="pickSub"></p>
      <div id="pickList"></div>
      <button class="btn ghost" onclick="logout()" data-i18n="back"></button>
    </section>

    <!-- Admin dashboard -->
    <section id="v-admin" class="hidden">
      <div class="card me">
        <div><h2 id="aName"></h2></div>
        <button class="linkbtn" onclick="logout()" data-i18n="logout"></button>
      </div>
      <div class="card">
        <div class="row2" style="flex-wrap:wrap">
          <div><label class="f" for="aYear" style="margin-top:0" data-i18n="year"></label><select id="aYear"></select></div>
          <div><label class="f" for="aMonth" style="margin-top:0" data-i18n="month"></label><select id="aMonth"></select></div>
          <div><label class="f" for="aSearch" style="margin-top:0" data-i18n="search"></label><input id="aSearch" type="text" data-ph="searchPh"></div>
        </div>
      </div>
      <div id="aExport" class="card hidden">
        <h2 data-i18n="exportTitle"></h2>
        <button id="exAll" class="btn ghost" data-i18n="exAll"></button>
        <button id="exRep" class="btn ghost" data-i18n="exRep"></button>
      </div>
      <div id="aStats" class="hidden">
        <div class="stats">
          <div class="stat"><b id="sTotal">0</b><span data-i18n="total"></span></div>
          <div class="stat ok"><b id="sDone">0</b><span data-i18n="done"></span></div>
          <div class="stat no"><b id="sMiss">0</b><span data-i18n="miss"></span></div>
        </div>
        <div class="meter"><i id="sBar" style="width:0"></i></div>
        <div class="tabs">
          <button id="fAll" class="on" onclick="aFilter('all')" data-i18n="fAll"></button>
          <button id="fDone" onclick="aFilter('done')" data-i18n="done"></button>
          <button id="fMiss" onclick="aFilter('miss')" data-i18n="miss"></button>
        </div>
      </div>
      <div id="aList"></div>
    </section>

    <!-- Teacher app -->
    <section id="v-app" class="hidden">
      <div class="card me">
        <div><h2 id="tName"></h2><small id="tInfo"></small></div>
        <button class="linkbtn" onclick="logout()" data-i18n="logout"></button>
      </div>

      <div class="tabs t3">
        <button id="tabR" class="on" onclick="tab('r')" data-i18n="tabReport"></button>
        <button id="tabS" onclick="tab('s')" data-i18n="tabStudents"></button>
        <button id="tabP" onclick="tab('p')" data-i18n="tabProfile"></button>
      </div>

      <div id="paneR">
        <div id="status" class="note"></div>
        <div id="formBox" class="card">
          <label class="f" for="rdate" style="margin-top:0" data-i18n="dateLbl"></label>
          <input id="rdate" type="date">
          <p id="rdateH" class="hd"></p>

          <div class="sec"><span data-i18n="photos"></span><small data-i18n="photosHint"></small></div>
          <div id="photoGrid" class="grid"></div>

          <div class="sec"><span data-i18n="videos"></span><small data-i18n="videosHint"></small></div>
          <div id="videoList"></div>

          <label class="f" for="notes" data-i18n="notesLbl"></label>
          <textarea id="notes" rows="3" maxlength="1000" data-ph="notesPh"></textarea>

          <button id="btnSend" class="btn" data-i18n="send"></button>
        </div>
      </div>

      <div id="paneS" class="hidden">
        <div class="card">
          <h2 data-i18n="stuTitle"></h2>
          <p class="sub" id="stuCount" style="margin:0 0 4px;font-weight:700;color:var(--green)"></p>
          <p class="sub" style="margin:0" data-i18n="stuSub"></p>
          <button id="btnAddStu" class="btn" data-i18n="addStudent"></button>
        </div>
        <div id="stuForm" class="card hidden">
          <h2 id="stuFormTitle"></h2>
          <label class="f" for="sName" data-i18n="stuName"></label>
          <input id="sName" type="text">
          <div class="row2">
            <div><label class="f" for="sAge" data-i18n="stuAge"></label><input id="sAge" type="tel" inputmode="numeric" maxlength="2"></div>
            <div><label class="f" for="sJuz" data-i18n="stuJuz"></label><select id="sJuz"></select></div>
          </div>
          <label class="f" for="sPhone" data-i18n="stuPhone"></label>
          <input id="sPhone" type="tel" inputmode="tel">
          <button id="btnSaveStu" class="btn" data-i18n="saveStudent"></button>
          <button class="btn ghost" onclick="closeStuForm()" data-i18n="cancel"></button>
        </div>
        <div id="stuList"></div>
      </div>

      <div id="paneP" class="card hidden">
        <h2 data-i18n="profTitle"></h2>
        <p class="sub" data-i18n="profSub"></p>
        <label class="f" for="pName" data-i18n="nameLbl"></label>
        <input id="pName" type="text">
        <label class="f" for="pPhone" data-i18n="phoneLbl"></label>
        <input id="pPhone" type="tel" inputmode="tel">
        <label class="f" for="pMail" data-i18n="emailLbl"></label>
        <input id="pMail" type="email">
        <button id="btnSave" class="btn" data-i18n="saveBtn"></button>
      </div>
    </section>
  </main>
</div>

<div id="busy" class="overlay hidden">
  <div class="box">
    <b id="busyTitle"></b>
    <div class="bar"><i id="busyBar"></i></div>

  a.forEach((v, i) => { s = s.split('{' + i + '}').join(v); });

// ترجمة رسائل الخادم (E_CODE أو E_CODE|param)
function err(e){
  const m = (e && e.message) || String(e);
  const x = /E_[A-Z0-9]+/.exec(m);
  if(!x || I18N.ar[x[0]] == null) return m;
  const after = m.split(x[0] + '|')[1];
  return t(x[0], after ? after.split(/\s/)[0] : '');
}
function monthLabel(m){
  const p = String(m).split('-');

const HLOC = { ar:'ar-SA-u-ca-islamic-umalqura-nu-latn', en:'en-u-ca-islamic-umalqura', bn:'bn-BD-u-ca-islamic-umalqura' };
const HSUF = { ar:'هـ', en:'AH', bn:'হিজরি' };
const dOf = x => { const p = String(x).split('-'); return new Date(+p[0], +p[1] - 1, +(p[2] || 1), 12); };
function hParts(d, lang){ try { return new Intl.DateTimeFormat(HLOC[lang], { day:'numeric', month:'long', year:'numeric' }).formatToParts(d); } catch(e){ return null; } }
const hGet = (p, ty) => (p.find(x => x.type === ty) || {}).value || '';
function hijriFull(d, lang){ lang = lang || LANG; const p = hParts(d, lang); return p ? hGet(p,'day') + ' ' + hGet(p,'month') + ' ' + hGet(p,'year') + ' ' + HSUF[lang] : ''; }
function hijriMonth(y, m, lang){
  lang = lang || LANG;
  const pa = hParts(new Date(y, m - 1, 1, 12), lang), pb = hParts(new Date(y, m, 0, 12), lang);
  if(!pa || !pb) return '';
  const ma = hGet(pa,'month'), mz = hGet(pb,'month'), ya = hGet(pa,'year'), yz = hGet(pb,'year');
  const s = ya === yz ? (ma === mz ? ma + ' ' + ya : ma + ' – ' + mz + ' ' + ya) : ma + ' ' + ya + ' – ' + mz + ' ' + yz;
  return s + ' ' + HSUF[lang];
}

function makeSlot(kind, labelKey, n, req){
  const isV = kind.indexOf('video') === 0;
  const hintKey = req ? 'hintReq' : 'hintOpt';
  const el = document.createElement('label');
  el.className = isV ? 'vrow' : 'slot';
  el.innerHTML = isV
    ? '<span class="ic">🎬</span><span class="t"><b data-i18n="' + labelKey + '" data-a="' + n + '"></b><span data-i18n="' + hintKey + '"></span></span><button type="button" class="x"></button>'
    : '<span class="plus">＋</span><b data-i18n="' + labelKey + '" data-a="' + n + '"></b><small data-i18n="' + (req ? 'req' : 'opt') + '"></small><span class="tick">✔</span><button type="button" class="x"></button>';
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = isV ? 'video/*' : 'image/*'; inp.hidden = true;
  el.prepend(inp);                                   // يجب أن يكون أول عنصر داخل label
  const hint = isV ? el.querySelector('.t span') : null;
  const xb = el.querySelector('.x'); xb.setAttribute('aria-label', t('remove'));
  el.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n, ...(e.dataset.a ? e.dataset.a.split(',') : [])); });

  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const lim = (isV ? 500 : 25);
    if(f.size > lim * 1048576){ inp.value = ''; return toast(t('tooBig', lim), true); }
    F[kind] = f; el.classList.add('has');
    if(isV){ hint.removeAttribute('data-i18n'); hint.textContent = f.name + ' (' + mb(f.size) + ')'; }
    else el.style.backgroundImage = 'url(' + URL.createObjectURL(f) + ')';
  };
  xb.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    delete F[kind]; inp.value = ''; el.classList.remove('has'); el.style.backgroundImage = '';
    if(isV){ hint.setAttribute('data-i18n', hintKey); hint.textContent = t(hintKey); }
  };
  return el;
}

/* ضغط الصور قبل الرفع لتوفير الإنترنت */
async function compress(file){
  try {
    const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
    const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return (b && b.size < file.size) ? b : file;
  } catch(e){ return file; }
}

/* الرفع المباشر إلى Drive */
function put(url, blob, onp){
  return new Promise((ok, no) => {
    const x = new XMLHttpRequest(); x.open('PUT', url);
    x.upload.onprogress = e => { if(e.lengthComputable) onp(e.loaded); };
    x.onload = () => (x.status >= 200 && x.status < 300) ? ok() : no(new Error('HTTP ' + x.status));
    x.onerror = () => no(new Error(t('netcut')));
    x.send(blob.slice(0, blob.size, ''));   // بدون Content-Type لتجنب مشاكل CORS
  });
}

async function uploadOne(it, onp){
  let last;
  for(let a = 0; a < 3; a++){
    try {
      const s = await api.startUpload(S.row, S.phone, S.w.month, it.k, it.name, it.mime, it.blob.size);
      await put(s.url, it.blob, onp);
      return s.name;
    } catch(e){ last = e; onp(0); await sleep(1500 * (a + 1)); }
  }
  throw new Error(t('failUpload', it.label, err(last)));
}

async function sendReport(){
  for(const i of PHOTOS) if(!F['photo' + i]) return toast(t('pickAllPhotos'), true);
  if(!F.video1) return toast(t('video1Req'), true);
  const date = $('#rdate').value, ml = monthLabel(S.w.month);
  if(!date || date < S.w.min || date > S.w.max) return toast(t('dateRange', ml), true);
  if(!confirm(t('confirm', ml))) return;

  busy(true, t('preparing')); prog(0, '');
  try {
    const items = [];
    for(const k of Object.keys(F).sort()){
      const f = F[k], isP = k.indexOf('photo') === 0;
      let blob = f, name = f.name, mime = f.type;
      if(isP){ blob = await compress(f); if(blob !== f){ name = name.replace(/\.[^.]+$/, '') + '.jpg'; mime = 'image/jpeg'; } }
      if(!mime) mime = isP ? 'image/jpeg' : 'video/mp4';
      items.push({ k, blob, name, mime, label: t(isP ? 'photoN' : 'videoN', k.slice(5)) });
    }
    const total = items.reduce((a, i) => a + i.blob.size, 0);
    let done = 0; const stored = {};
    for(let n = 0; n < items.length; n++){
      const it = items[n];
      busy(true, t('uploading', it.label, n + 1, items.length));
      stored[it.k] = await uploadOne(it, loaded => prog((done + loaded) / total, t('ofN', mb(done + loaded), mb(total))));
      done += it.blob.size;
    }
    busy(true, t('saving')); prog(1, '');
    const r = await api.submitReport(S.row, S.phone, {
      month:S.w.month, date, dateH:hijriFull(dOf(date), 'ar'), notes:$('#notes').value,
      photos:PHOTOS.map(i => stored['photo' + i]),
      videos:VIDEOS.map(i => stored['video' + i] || '')
    });
    S.report = { submittedAt:r.submittedAt, date };
    buildSlots(); $('#notes').value = ''; renderStatus(); window.scrollTo({ top:0, behavior:'smooth' });
    toast(t('sent'));
  } catch(e){ toast(err(e), true); }
  finally { busy(false); }
}

function dl(r){

  for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u8], { type:r.mime })); a.download = r.name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}

function aFilter(f){
  A.filter = f;
  [['all','All'],['done','Done'],['miss','Miss']].forEach(p => $('#f' + p[1]).classList.toggle('on', p[0] === f));
  renderList();
}

function renderList(){
  const q = $('#aSearch').value.trim().toLowerCase();
  const box = $('#aList'); box.innerHTML = '';
  const rows = A.data.rows.filter(r =>
    (A.filter === 'all' || (A.filter === 'done') === r.submitted) &&
    (!q || (r.name + ' ' + r.halaqa + ' ' + r.jiha).toLowerCase().indexOf(q) > -1));
  if(!rows.length){ box.innerHTML = '<div class="empty"></div>'; box.firstChild.textContent = t('noResults'); return; }
  rows.forEach(r => box.appendChild(card(r)));
}

function card(r){
  const d = document.createElement('details'); d.className = 'item';
  const sm = document.createElement('summary');
  const ti = document.createElement('div'); ti.innerHTML = '<b></b><small></small>';
  ti.firstChild.textContent = r.name;
  ti.lastChild.textContent = [r.halaqa && t('halaqa', r.halaqa), r.jiha].filter(Boolean).join(' — ');
  const b = document.createElement('span'); b.className = 'badge ' + (r.submitted ? 'ok' : 'no'); b.textContent = t(r.submitted ? 'badgeOk' : 'badgeNo');
  sm.append(ti, b); d.appendChild(sm);

  const body = document.createElement('div'); body.className = 'body'; d.appendChild(body);
  const info = document.createElement('p'); info.className = 'sub'; info.style.margin = '10px 0 0';
  info.textContent = [r.region, r.students && t('studentsN', r.students), t('regStudents', r.registered), r.submitted && t('repDate', r.date + (r.dateH ? ' — ' + r.dateH : '')), r.submitted && t('sentAt', r.submittedAt)].filter(Boolean).join(' — ');
  body.appendChild(info);
  if(r.notes){ const n = document.createElement('p'); n.textContent = t('notes', r.notes); body.appendChild(n); }

  if(r.phone){
    const c = document.createElement('div'); c.className = 'contact';
    c.innerHTML = '<a dir="ltr"></a><a target="_blank" rel="noopener"></a>';
    c.firstChild.textContent = '📞 ' + r.phone; c.firstChild.href = 'tel:+' + r.wa;
    c.lastChild.textContent = t('wa'); c.lastChild.href = 'https://wa.me/' + r.wa;
    body.appendChild(c);
  }
  if(A.data.account.export || r.phone){
    const ac = document.createElement('div'); ac.className = 'contact';
    if(r.phone){
      const vb = document.createElement('button'); vb.textContent = t('viewStudents');
      vb.onclick = async () => {
        let sl = body.querySelector('.slist');
        if(sl){ sl.remove(); return; }
        try {
          const res = await api.adminStudents(A.phone, r.serial);
          sl = document.createElement('div'); sl.className = 'slist';
          if(!res.students.length) sl.textContent = t('noStudents');
          res.students.forEach(s => { const li = document.createElement('div'); li.textContent = [s.name, t('ageN', s.age), s.phone, Number(s.juz) === 0 ? t('juzNone') : t('juzN', s.juz)].filter(Boolean).join(' — '); sl.appendChild(li); });
          body.appendChild(sl);
        } catch(e){ toast(err(e), true); }
      };
      ac.appendChild(vb);
    }
    if(A.data.account.export){
      const eb = document.createElement('button'); eb.textContent = t('exOne');
      eb.onclick = () => doExport(eb, () => api.exportStudents(A.phone, LANG, r.serial));
      ac.appendChild(eb);
      if(r.submitted){
        const pb = document.createElement('button'); pb.textContent = t('exPdf');
        pb.onclick = () => doExport(pb, () => api.exportReportPdf(A.phone, LANG, A.data.month, r.serial, monthBoth(A.data.month), logoPng()));
        ac.appendChild(pb);
      }
    }
    body.appendChild(ac);
  }
  if(r.submitted && r.photos){
    let loaded = false;
    d.ontoggle = () => {                      // تحميل الصور عند فتح البطاقة فقط
      if(!d.open || loaded) return; loaded = true;
      const g = document.createElement('div'); g.className = 'thumbs';
      r.photos.forEach((id, i) => {
        const im = document.createElement('img'); im.loading = 'lazy'; im.alt = t('photoN', i + 1); im.src = thumb(id, 400);
        im.onclick = () => { $('#lbImg').src = thumb(id, 1600); $('#lbOpen').href = 'https://drive.google.com/file/d/' + id + '/view'; $('#lb').classList.remove('hidden'); };
        g.appendChild(im);
      });
      r.videos.forEach((id, i) => {
        const v = document.createElement('button'); v.className = 'vt'; v.textContent = '▶'; v.setAttribute('aria-label', t('play', i + 1));
        v.onclick = () => {
          const w = document.createElement('div'); w.className = 'vwrap';
          w.innerHTML = '<iframe allow="autoplay" allowfullscreen></iframe>';
          w.firstChild.src = 'https://drive.google.com/file/d/' + id + '/preview';
          body.appendChild(w); v.remove();
        };
        g.appendChild(v);
      });
      body.appendChild(g);
    };
  }
  return d;
}

$('#aYear').onchange = aGo; $('#aMonth').onchange = aGo;

$('#btnAddStu').onclick = () => openStuForm(null);
$('#btnSaveStu').onclick = saveStu;
$('#rdate').onchange = updateHDate;
$('#aSearch').oninput = () => renderList();
applyLang();
(async function init(){
  const s = store.get();
  if(!s) return;
  try { if(s.admin) await enterAdmin(s.phone); else await enter({ row:s.row }, s.phone); }
  catch(e){ store.clear(); show('v-login'); }
})();
